[package]
name = "anqa-hud"
version = "0.1.0"
edition = "2021"
description = "Sol-style session palette for the anqa control plane"
authors = ["Ali-Akber Saifee"]

[lib]
name = "anqa_hud"
path = "src/lib.rs"

[[bin]]
name = "anqa-hud"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
global-hotkey = "0.6"
iced = { version = "0.14", default-features = true, features = [
    "tokio",
    "markdown",
    "canvas",
    "image",
    "advanced",
    "advanced-shaping",
    "lazy",
    "highlighter",
    "svg",
] }
notify-rust = "4"
regex = "1"
icedtea = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
wayland-backend = { version = "0.3.16", features = ["client_system"] }
wayland-client = { version = "0.31.15", features = ["system"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging"] }
x11rb = "0.13"

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.21", default-features = false }

[dev-dependencies]
iced_tiny_skia = "0.14"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSData",
    "NSProcessInfo",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSAccessibilityConstants",
    "NSAccessibilityProtocols",
    "NSApplication",
    "NSEvent",
    "NSImage",
    "NSMenu",
    "NSMenuItem",
    "NSResponder",
    "NSRunningApplication",
    "NSScreen",
    "NSView",
    "NSWindow",
] }
