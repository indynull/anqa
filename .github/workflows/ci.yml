name: CI

on:
  push:
    branches: ["*"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

# One in-flight CI per branch / PR; a new push cancels the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # Python: lint, schema drift, examples contract (Linux only).
  # ---------------------------------------------------------------------------
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: lint-python
      - name: Linux iced system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - run: uv python install 3.13
      - run: uv sync --group test --group dev
      - name: Ruff + mypy + policy scripts
        run: just lint
      - name: Config and control schema drift
        run: just schema-check
      - name: Examples contract
        run: just examples-check

  # ---------------------------------------------------------------------------
  # Python: unit suite (Linux only).
  # ---------------------------------------------------------------------------
  test:
    name: Test Python (${{ matrix.label }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - scan: "0"
            label: pure Python
          - scan: "1"
            label: with native scan
    env:
      ANQA_SCAN: ${{ matrix.scan }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: test-python-${{ matrix.scan }}
      - name: Linux iced system libraries
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - run: uv python install 3.13
      - run: uv sync --group test --group dev
      - name: cargo test anqa-core
        if: matrix.scan == '1'
        run: cargo test --manifest-path core/Cargo.toml
      - name: pytest with coverage
        run: uv run pytest tests/ -q --tb=short --cov=anqa --cov-report=xml --cov-fail-under=0
      - name: Upload coverage to Codecov
        if: matrix.scan == '0'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: true
          use_oidc: true

  # ---------------------------------------------------------------------------
  # anqa-hud (iced): full gate on Linux; clippy/test/release build on
  # macOS and Windows so tray / window paths compile there too.
  # ---------------------------------------------------------------------------
  hud:
    name: HUD (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            full: true
          - name: macos
            os: macos-latest
            full: false
          - name: windows
            os: windows-latest
            full: false
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: ${{ matrix.full && 'rustfmt, clippy, llvm-tools-preview' || 'rustfmt, clippy' }}

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: hud-${{ matrix.name }}

      # Full Linux gate: theme map (needs Python) + fmt/clippy/test + llvm-cov.
      - name: Python for HUD theme map
        if: matrix.full
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.13
        if: matrix.full
        run: uv python install 3.13
      - name: Sync Python deps
        if: matrix.full
        run: uv sync --group test --group dev
      - name: cargo-llvm-cov and just
        if: matrix.full
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,just
      - name: Linux iced system libraries
        if: matrix.full
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev pkg-config
      - name: just hud-check
        if: matrix.full
        run: just hud-check
      - name: Upload HUD coverage to Codecov
        if: matrix.full
        uses: codecov/codecov-action@v5
        with:
          files: desktop/lcov.info
          flags: rust
          fail_ci_if_error: true
          use_oidc: true

      # macOS / Windows: compile and test the crate (no theme generator / cov).
      - name: rustfmt
        if: ${{ !matrix.full }}
        run: cargo fmt --check --manifest-path desktop/Cargo.toml
      - name: clippy
        if: ${{ !matrix.full }}
        run: cargo clippy --manifest-path desktop/Cargo.toml --all-targets -- -D warnings
      - name: cargo test
        if: ${{ !matrix.full }}
        run: cargo test --manifest-path desktop/Cargo.toml
      - name: release build
        if: ${{ !matrix.full }}
        run: cargo build --release --manifest-path desktop/Cargo.toml

  # ---------------------------------------------------------------------------
  # Platform wheels (cibuildwheel) + sdist. main, tags, and workflow_dispatch.
  # Those same events upload to TestPyPI.
  # ---------------------------------------------------------------------------
  wheels:
    name: Wheel (${{ matrix.os }})
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux-intel
            runs-on: ubuntu-latest
          - os: linux-arm
            runs-on: ubuntu-24.04-arm
          - os: windows-intel
            runs-on: windows-latest
          - os: windows-arm
            runs-on: windows-11-arm
          - os: macos-intel
            runs-on: macos-15-intel
          - os: macos-arm
            runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: pypa/cibuildwheel@v4.2.0
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error
          retention-days: 30

  sdist:
    name: Source distribution
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish TestPyPI
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')))
    needs: [lint-python, test, hud, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/project/anqa/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: List files to publish
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
          skip-existing: true

  publish-pypi:
    name: Publish PyPI
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [lint-python, test, hud, wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/project/anqa/
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: cibw-*
          path: dist
          merge-multiple: true
      - name: List files to publish
        run: ls -la dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
