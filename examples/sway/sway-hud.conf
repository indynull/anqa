# anqa overlay (dev.indynull.anqa-hud.overlay). Include from sway config:
#   include ~/.config/anqa/sway-hud.conf
# Or copy this pack: anqa desktop --install-desktop writes the same file.
for_window [app_id="dev.indynull.anqa-hud.overlay"] floating enable
for_window [app_id="dev.indynull.anqa-hud.overlay"] border pixel 0
for_window [app_id="dev.indynull.anqa-hud.overlay"] sticky enable
bindsym $mod+Shift+a exec anqa desktop --toggle
